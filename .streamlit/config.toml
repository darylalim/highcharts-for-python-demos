# Project-level Streamlit theme: the bundled "financial-dashboard" template
# (streamlit/.agents/skills/developing-with-streamlit/assets/templates/themes/configs/),
# hex lowercased to match the builder's convention.
#
# It is a SINGLE [theme] table, and that is the point: defining both [theme.light]
# and [theme.dark] is what unlocks the light/dark toggle in the app's settings menu,
# so a lone [theme] locks the app to one mode — here, dark. Every viewer therefore
# resolves to the dark shell, which is what lets the builder theme UNCONDITIONALLY:
# there is no theme read in streamlit_app.py and no `dark=` flag on any builder, because
# a branch that cannot vary (and a cache key that cannot vary with it) would be theatre.
# What that trades away is self-correction — the chart no longer FOLLOWS the shell, it
# assumes it — so re-adding a subtable here would put dark charts on a light shell with
# nothing at runtime objecting. tests/test_smoke.py::
# test_app_theme_is_a_single_mode_with_no_light_dark_toggle is the only thing standing
# between that edit and a silently wrong render.
#
# The Highcharts charts render in an iframe / server-side PNG, so NONE of these colors
# reach them — not even chartCategoricalColors, which Streamlit applies only to its own
# Vega/Plotly charts. The charts mirror this theme by hand in highcharts_builder:
# DEFAULT_COLORS == chartCategoricalColors below, _DARK_CHROME's bg/text/muted/grid ==
# backgroundColor/textColor/grayColor/borderColor, and _HEATMAP_GRADIENT_DARK is drawn
# from chartSequentialColors. That duplication is guarded mechanically by
# tests/test_smoke.py::test_theme_colors_stay_in_sync_with_config, so editing one side
# alone fails the suite rather than drifting quietly.
[theme]
base = "dark"
primaryColor = "#60a5fa"             # bright blue for dark mode
backgroundColor = "#0f172a"          # deep slate
secondaryBackgroundColor = "#1e293b" # slightly lighter slate
codeBackgroundColor = "#1e293b"
textColor = "#f1f5f9"                # light text
linkColor = "#60a5fa"
borderColor = "#334155"
codeTextColor = "#cbd5e1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"                   # subtle rounding - professional, not playful
buttonRadius = "6px"

# Typography - clean, professional fonts
# One request, not two: the upstream template also sets `headingFont` to Inter at
# wght@600;700, a strict SUBSET of the weights below — a second render-blocking fetch
# from fonts.googleapis.com for no visual difference. Headings inherit `font`.
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors for financial indicators
greenColor = "#34d399"  # positive/gains - bright green
redColor = "#f87171"    # negative/losses - bright red
yellowColor = "#fbbf24" # warnings/caution
orangeColor = "#fb923c" # alerts
blueColor = "#60a5fa"   # informational
violetColor = "#a78bfa" # accent/highlights
grayColor = "#94a3b8"   # neutral/secondary text (== _DARK_CHROME["muted"])

# Chart colors. Streamlit applies these to its OWN charts only; this app renders every
# chart with Highcharts, which mirrors this list as highcharts_builder.DEFAULT_COLORS.
# The ORDER is load-bearing there: index 0 is the brand primary (waterfall's closing
# total, the heatmap ramp's high end, bullet's bar), 1 is the green a waterfall rise
# takes, and 3 is the red a fall and a boxplot outlier take. Reordering repaints those
# meanings.
#
# ONE DELIBERATE DEVIATION from the upstream template: index 6 is pink-400 (#f472b6),
# not the template's gray #94a3b8. The template sets grayColor to that same gray, and
# _DARK_CHROME["muted"] copies grayColor for axis labels, legend hover and axis titles —
# so a 7-series chart drew its 7th series in exactly the axis-label colour, a 1.00:1
# collision. The gray had to leave the *categorical* scale rather than the chrome,
# because chrome is what the shell and the chart must agree on. Pink also restores the
# hue this palette's predecessor carried at index 6. Guarded by
# test_no_series_colour_collides_with_the_chart_chrome.
chartCategoricalColors = [
    "#60a5fa",
    "#34d399",
    "#a78bfa",
    "#f87171",
    "#fbbf24",
    "#38bdf8",
    "#f472b6",
    "#fb923c",
]

# Sequential colors for heatmaps (blue gradient). highcharts_builder draws
# _HEATMAP_GRADIENT_DARK's two endpoints from this scale.
chartSequentialColors = [
    "#0c4a6e",
    "#075985",
    "#0369a1",
    "#0284c7",
    "#0ea5e9",
    "#38bdf8",
    "#7dd3fc",
    "#bae6fd",
    "#e0f2fe",
    "#f0f9ff",
]

# Dataframe styling
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1e293b"

# Sidebar
[theme.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
codeBackgroundColor = "#1e293b"
textColor = "#f1f5f9"
borderColor = "#334155"
primaryColor = "#60a5fa"

[server]
# Auto-rerun on file save, so editing streamlit_app.py / the builder reloads
# without a manual rerun. Streamlit auto-uses the watchdog dev dependency for
# fast watching when it's installed, and falls back to polling otherwise — so we
# don't pin fileWatcherType (which would warn in installs without the dev group).
runOnSave = true
