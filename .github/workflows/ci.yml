name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref — but only for PRs (rapid pushes to a
# branch under review). An IN-PROGRESS main run is never cancelled, so the release
# job below can't be killed mid-run and strand a pushed tag with no release. A
# PENDING one still can be (a concurrency group holds at most one), which is safe
# only because the release job is catch-up rather than incremental: it cuts every
# version above the watermark, so a superseded run's bump is picked up by the next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: Gates (Ruff · ty · pytest)
    runs-on: ubuntu-latest
    # Measured runtime is under a minute. The default is 360, and with
    # cancel-in-progress false for main a hung run would hold the concurrency
    # group — and every release behind it — for that whole time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      # One sync for all three gates. No setup-python step: `uv sync` reads
      # .python-version (3.12) and fetches a matching managed interpreter
      # automatically if one isn't present. The sync is required, not merely a
      # pin: ty resolves third-party imports (pandas, streamlit, highcharts-core)
      # from the project venv, and Ruff runs from it too so its version has one
      # source of truth — pyproject.toml's dev group via uv.lock — with no
      # hardcoded version literals to drift.
      - name: Install dependencies (locked)
        id: sync
        run: uv sync --locked

      # `!cancelled() && sync succeeded` on every gate is what makes one job as
      # informative as the three it replaces: a step failure no longer skips the
      # rest, so a single push reports lint AND type AND test status instead of
      # only the first to break. A failed step still fails the job. Ruff and ty
      # run before pytest so a lint or type error reports in seconds rather than
      # after the suite. --output-format=github annotates PRs inline.
      - name: Ruff lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check .

      - name: ty check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ty check --output-format=github

      - name: Run tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pytest

  release:
    name: Release (tag + GitHub release)
    needs: [gates]
    # A release can only ever be cut from a fully-passing main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scoped to this job alone, so the gate job above keeps the top-level
    # least-privilege read-only token; only this one may create tags and releases.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is load-bearing: an older un-released version (two bumps
          # in one push) is tagged at the commit that INTRODUCED it, found by a
          # pickaxe over pyproject.toml's whole history (git log -S below).
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Cut a release for every version above the latest released one
        env:
          GH_TOKEN: ${{ github.token }}
        # release.py is stdlib-only and needs no project deps, so it runs on the
        # uv-pinned 3.12 with `--no-project` (no `uv sync`) — the pinned
        # interpreter every other job and hook uses, not the runner's system
        # python3. Idempotent: a version already released is skipped, so on a push
        # that doesn't bump the version there is nothing above the watermark.
        run: |
          set -euo pipefail
          PY="uv run --no-project --python 3.12 python .github/scripts/release.py"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The latest release is the watermark; anything above it still needs one.
          # `gh release view` exits 1 both when there are genuinely no releases and
          # on any transient auth/5xx failure, so swallowing its status conflated the
          # two: a blip read as "no releases", and an empty watermark releases only
          # the current version — silently dropping intermediate ones, permanently,
          # and green. So probe for existence with a call whose failure IS an error,
          # and let `set -e` see it. (release list orders by date, and this job
          # deliberately creates older versions with --latest=false, so its first row
          # is only a presence signal — the watermark itself still comes from view.)
          if ! releases="$(gh release list --limit 1 --json tagName -q '.[].tagName')"
          then
            echo "::error::Could not read the release list — refusing to guess the watermark."
            exit 1
          fi
          latest=""
          [ -n "$releases" ] && latest="$(gh release view --json tagName -q .tagName)"
          to_cut="$($PY to-release "$latest")"
          echo "Latest release: ${latest:-none}. To cut: ${to_cut:-nothing}."
          [ -n "$to_cut" ] || exit 0
          current="$($PY version)"  # the highest; read only now there's work to do

          # to_cut is oldest-first; version strings are whitespace-free tokens.
          for version in $to_cut; do
            tag="v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released — skipping."
              continue
            fi
            echo "Cutting $tag."

            notes="$RUNNER_TEMP/notes-$tag.md"
            $PY notes "$version" > "$notes"

            # The current (highest) version is tagged at HEAD (so its post-bump
            # commits ride along) and marked Latest; an older one is tagged at the
            # commit that first introduced its bump and is not Latest — either way
            # the tag's one checkable fact holds, that its commit declares this
            # version in pyproject.toml.
            if [ "$version" = "$current" ]; then
              commit="$GITHUB_SHA"
              latest_flag=true
            else
              commits="$(git log --reverse --format=%H \
                -S "version = \"$version\"" -- pyproject.toml)"
              commit="${commits%%$'\n'*}"
              if [ -z "$commit" ]; then
                echo "::error::No commit declares version $version in pyproject.toml."
                exit 1
              fi
              latest_flag=false
            fi

            # Annotated tag (matching the v0.7.0–v0.11.0 convention), created only
            # if it isn't already on the remote (a prior run may have pushed it).
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" \
              >/dev/null 2>&1; then
              git tag -a "$tag" -m "$tag" "$commit"
              git push origin "$tag"
            fi

            # --verify-tag: without it gh CREATES a missing tag at the default
            # branch's HEAD, which for an older version would silently point its tag
            # at main instead of its bump commit. Every path above pushes the tag
            # first, so this is defence in depth against a wrong-but-green release.
            gh release create "$tag" --verify-tag \
              --title "$tag" \
              --notes-file "$notes" \
              --latest="$latest_flag"
          done
